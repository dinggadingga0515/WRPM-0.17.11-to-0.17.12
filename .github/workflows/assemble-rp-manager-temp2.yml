name: Assemble RP Manager temp2

on:
  push:
    paths:
      - '.upload/rp_manager_temp2/READY'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        shell: bash
        run: |
          set -euo pipefail
          out="RP_Manager_0.17.14_TEMP2_ERROR_HELP.user.js"
          : > "$out"
          for f in .upload/rp_manager_temp2/part_*; do
            cat "$f" >> "$out"
            if [[ "$f" != ".upload/rp_manager_temp2/part_042" ]]; then
              printf '\r\n' >> "$out"
            fi
          done
          test "$(wc -c < "$out")" -eq 4966836
          echo "ef272417ce692ca06593637b76da208cd9c34c1aac9dd025ab1e24b8f9476a49  $out" | sha256sum -c -
          rm -rf .upload/rp_manager_temp2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out" .upload/rp_manager_temp2
          git commit -m "Assemble RP Manager 0.17.14 temp2 error-help build"
          git push
